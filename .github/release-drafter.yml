name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: 'Features'
    labels: [feature, enhancement]
  - title: 'Bug Fixes'
    labels: [bug, fix, bugfix]
  - title: 'Documentation'
    labels: [documentation, docs]
  - title: 'Security'
    labels: [security]
  - title: 'Chores'
    labels: [chore, ci, dependencies]
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels: [major, breaking]
  minor:
    labels: [feature, enhancement, minor]
  patch:
    labels: [bug, fix, patch, security, chore]
  default: patch
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/DryadeAI/dryade-plugins-sdk/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
