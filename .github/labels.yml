# Canonical label set applied via: gh label create -F .github/labels.yml --force
# Run from a fresh clone of dryade-plugins-sdk.
- name: bug
  color: 'd73a4a'
  description: Something is not working
- name: feature
  color: '0e8a16'
  description: New SDK capability
- name: enhancement
  color: 'a2eeef'
  description: Improvement to existing capability
- name: documentation
  color: '0075ca'
  description: Docs site, README, or inline docs
- name: security
  color: 'b60205'
  description: Security-sensitive issue or fix
- name: dependencies
  color: '0366d6'
  description: Dependency updates
- name: chore
  color: 'cccccc'
  description: Maintenance / refactor / tooling
- name: good first issue
  color: '7057ff'
  description: Good for newcomers — well-scoped, low-risk
- name: help wanted
  color: '008672'
  description: Extra attention is needed; maintainers welcome PRs
- name: question
  color: 'cc317c'
  description: Question — consider asking in Discussions Q&A first
- name: breaking
  color: 'b60205'
  description: Breaking change — requires major version bump
- name: needs-triage
  color: 'fbca04'
  description: Newly opened, awaiting maintainer review
- name: needs-review
  color: 'fbca04'
  description: PR awaiting maintainer review
