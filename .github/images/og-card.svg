    <rect x="200" width="320" height="42" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="360" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" fill="#e2e8f0">'dryade-plugins-sdk[cli]'</text>
  </g>
  <text x="1120" y="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#94a3b8" opacity="0.7">sdk.dryade.ai</text>
