<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1929"/>
      <stop offset="100%" stop-color="#0d2538"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="180" cy="160" r="280" fill="url(#accent)" opacity="0.08"/>
  <circle cx="1050" cy="500" r="200" fill="url(#accent)" opacity="0.05"/>
  <g transform="translate(80, 90)">
    <image href="dryade-logo.svg" width="160" height="160" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text x="80" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1.5">dryade-plugins-sdk</text>
  <text x="80" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500" fill="#cbd5e1">Author Dryade plugins in Python.</text>
  <text x="80" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500" fill="#cbd5e1">Pure Protocol contracts. Zero host imports. MIT.</text>
  <g transform="translate(80, 520)">
    <rect width="180" height="42" rx="6" fill="#22c55e"/>
